<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2018">
<title>Timeless Journeys</title>
<link rel="icon" href="img/icona.png">
<style>
@font-face { font-family: 'Titolo'; src: url('font/IMFellEnglishSC.ttf'); }
@font-face { font-family: 'Testo'; src: url('font/EBGaramond-Medium.ttf'); }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #3b2a1c; background: #2b2018; overflow: hidden; touch-action: none; font-family: 'Testo', sans-serif; }
#canvas { display: block; width: 100vw; height: 100vh; }
#canvas:focus { outline: none; }
#avvio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: #2b2018 url('img/copertina.webp') center / cover no-repeat; z-index: 10; text-align: center; padding: 20px; }
#avvio h1 { font-family: 'Titolo', sans-serif; font-weight: 400; font-size: min(120px, 16vw); color: #f6e7c4; margin: 0; letter-spacing: 1px;
  text-shadow: 0 3px 0 #5a2d10, 0 10px 24px rgba(0,0,0,.6); }
#avvio .box { background: rgba(241,230,204,.94); border: 3px solid #b88a3a; border-radius: 22px; padding: 22px 34px; max-width: 640px; min-width: 260px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#avvio p { font-size: 24px; margin: 8px 0; }
#avvio button { font-family: 'Titolo', sans-serif; font-size: 38px; color: #3b2a1c; background: #efe0bd; border: 4px solid #b88a3a;
  border-radius: 16px; padding: 10px 40px; cursor: pointer; letter-spacing: 1px; }
#avvio button:active { transform: scale(.97); }
#stato { color: #f6e7c4; font-size: 24px; min-height: 30px; text-shadow: 0 2px 4px #000; }
#stato progress { width: 360px; height: 18px; max-width: 80vw; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Il tuo browser non supporta i canvas.</canvas>
<div id="avvio">
  <h1>Timeless Journeys</h1>
  <div class="box">
    <p>Il Grand Tour italiano, da Torino a Palermo: carte in catena, caffè letterari, lettere e Diari di Viaggio.</p>
    <button id="apri">Si parte</button>
  </div>
  <div id="stato"></div>
</div>
<div id="versione" style="position:fixed;right:8px;bottom:6px;color:#f1e6cc;font-size:13px;z-index:11">versione __VERSIONE__</div>
<script src="js/vendor/qrcode.js"></script>
<script src="$GODOT_URL?v=__VERSIONE__"></script>
<script type="module">
import './js/ponte.js?v=__VERSIONE__';
import { sbloccaAudio } from './js/suoni.js?v=__VERSIONE__';

const GODOT_CONFIG = $GODOT_CONFIG;
// ogni pubblicazione ha il suo numero: il browser non riusa la versione vecchia del gioco
const VERSIONE = '__VERSIONE__';
GODOT_CONFIG.mainPack = (GODOT_CONFIG.mainPack || 'index.pck') + '?v=' + VERSIONE;
const engine = new Engine(GODOT_CONFIG);
const stato = document.getElementById('stato');
const q = new URLSearchParams(location.search);

async function schermoAcceso() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) { /* ok */ }
}

let partito = false;
async function parti() {
  if (partito) return;
  partito = true;
  sbloccaAudio(); schermoAcceso();
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) {
    stato.textContent = 'Questo browser non riesce ad aprire il gioco: ' + missing.join(', ');
    return;
  }
  stato.innerHTML = 'Preparo i bauli... <progress id="pr"></progress>';
  const pr = document.getElementById('pr');
  try {
    await engine.startGame({
      onProgress(cur, tot) { if (cur > 0 && tot > 0) { pr.value = cur; pr.max = tot; } },
    });
    document.getElementById('avvio').remove();
    document.getElementById('versione').remove();
  } catch (e) {
    console.error(e);
    stato.textContent = 'Errore: ' + (e?.message || e);
  }
}
document.getElementById('apri').addEventListener('click', parti);
if (q.has('auto') || q.has('subito')) parti();
</script>
</body>
</html>
